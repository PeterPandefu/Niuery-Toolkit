name: Release desktop app

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test release notes
        run: node --test scripts/release-notes.test.mjs

      - name: Prepare release notes
        id: notes
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { readFile } = require('node:fs/promises');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { buildReleaseNotes } = await import(pathToFileURL(path.join(process.cwd(), 'scripts/release-notes.mjs')).href);
            let changelog = '';
            try {
              changelog = await readFile('CHANGELOG.md', 'utf8');
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
            }
            return await buildReleaseNotes({
              changelog,
              tagName: context.ref.replace('refs/tags/', ''),
              generateNotes: async (tagName) => {
                core.info('No curated notes found; generating GitHub release notes.');
                const { data } = await github.rest.repos.generateReleaseNotes({
                  ...context.repo,
                  tag_name: tagName,
                });
                return data.body;
              },
            });

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Niuery Toolkit ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.result }}
          releaseDraft: false
          prerelease: false
